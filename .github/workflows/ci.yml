name: React CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React application
        run: pnpm run build

# 
# actions/checkout@v4
# │       │        │
# │       │        └── 版本
# │       │
# │       └── Action / Repository 名
# │
# └── GitHub owner / organization

# 使用 GitHub 官方 actions 组织下的 checkout Action，第 4 大版本。